name: "Feature Implementation Request"
description: "Propose and track a comprehensive feature spanning DB, API, Auth, and Frontend."
title: "[FEATURE]: "
labels: ["enhancement", "architecture"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a new feature! Please fill out the sections below to outline the technical requirements across all layers.

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description & User Story
      description: What are we building, why are we building it, and who is it for?
      placeholder: "As a user, I want to..."
    validations:
      required: true

  - type: dropdown
    id: auth-requirement
    attributes:
      label: User Authentication & Permissions
      description: Does this feature require specific auth rules, roles, or scopes?
      options:
        - Public (No auth required)
        - Authenticated User (Standard login)
        - Role-Based Access Control (Admin/Manager/etc.)
        - API Token / Scoped Access
    validations:
      required: true

  - type: textarea
    id: db-implementation
    attributes:
      label: Database Implementation
      description: Detail any new tables, columns, indexes, or migrations needed.
      placeholder: |
        - New Tables: `table_name`
        - Columns: `id`, `user_id`, `created_at`
        - Indexes: `idx_user_id`
    validations:
      required: false

  - type: textarea
    id: api-design
    attributes:
      label: API Design
      description: Outline the endpoints, HTTP methods, and request/response payloads.
      placeholder: |
        - Method: POST /api/v1/resource
        - Request Payload: { "name": "string" }
        - Response Payload: { "id": "uuid", "status": "success" }
    validations:
      required: false

  - type: textarea
    id: frontend-implementation
    attributes:
      label: Frontend Implementation
      description: Describe the UI components, state management, and user flows.
      placeholder: |
        - Components: New form widget, dashboard table
        - State/Hooks: Redux slice or React Query mutation
    validations:
      required: false

  - type: checkboxes
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria & Checklist
      description: Check off the layers completed before requesting review.
      options:
        - label: Database migrations created and tested
        - label: API endpoints implemented and documented
        - label: Authentication & security rules applied
        - label: Frontend UI components built and integrated
        - label: Unit/Integration tests written
    validations:
      required: true
